<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1526" />
      <stop offset="100%" stop-color="#1b2a4a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8d9b5" />
      <stop offset="50%" stop-color="#c9a24b" />
      <stop offset="100%" stop-color="#a37c28" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Card / Shield -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-opacity="0.5" />

  <!-- Graduation Cap Icon -->
  <g filter="url(#shadow)">
    <!-- Top Diamond -->
    <polygon points="256,120 440,210 256,300 72,210" fill="url(#goldGrad)" />

    <!-- Cap Body Base -->
    <path d="M152,260 L152,350 C152,385 200,410 256,410 C312,410 360,385 360,350 L360,260 C330,285 295,298 256,298 C217,298 182,285 152,260 Z" fill="url(#goldGrad)" opacity="0.9" />

    <!-- Tassel String & Hanging Bulb -->
    <path d="M400,225 L400,340 C400,355 390,365 385,365" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" fill="none" />
    <circle cx="385" cy="375" r="16" fill="url(#goldGrad)" />
  </g>
</svg>